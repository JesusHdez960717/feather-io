name: service
description: Service for the feather-io project, a lightweight S3 compatible storage
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  winter:
    path: ../../winter
#    git:
#      url: https://github.com/Root-101/winter.git
#      ref: feature/retake_project

  path: 1.9.1                   #storage

  mime: 2.0.0                   #file extensions

  archive: 4.1.0                #zip
  crypto: 3.0.7                 #HMAC & S3 Sig V4
  pointycastle: 4.0.0           #AES-GCM for the access key secrets

  dart_jsonwebtoken: 3.4.1      #JWT

  #i18n: typed error messages generated from lib/i18n/*.i18n.yaml (`fvm dart run slang`)
  slang: 4.19.2
  #Imported by the code that slang generates
  intl: 0.20.2

  #DB
  drift: 2.31.0
  sqlite3: 2.9.4

dev_dependencies:
  http: 1.6.0
  lints: 6.1.0
  test: 1.30.0

  #DB
  drift_dev: 2.31.0
  build_runner: 2.15.0