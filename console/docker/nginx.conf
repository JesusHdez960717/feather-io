server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The files that point to the rest of the build, and env.js, must never be stale
    location ~ ^/(index\.html|env\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)?$ {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
