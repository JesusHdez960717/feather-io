<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Feather-IO Console</title>
    <meta name="description" content="S3-Compatible Storage Management Console">

    <!-- Responsive -->
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Feather Console">

    <!-- Theme color -->
    <meta name="theme-color" content="#111827">

    <!-- Icons -->
    <link rel="apple-touch-icon" href="icons/Icon-192.png">
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <style>
        * {
          box-sizing: border-box;
        }

        html,
        body {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background: #111827;
          font-family: Arial, Helvetica, sans-serif;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
        }

        /* Splash Screen */
        #splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          background: linear-gradient(
            135deg,
            #111827 0%,
            #1f2937 100%
          );
          z-index: 9999;
          transition: opacity 0.35s ease;
        }

        /* Logo */
        #splash img {
          width: 120px;
          height: 120px;
          margin-bottom: 24px;
          animation: pulse 1.8s infinite ease-in-out;
        }

        /* Text */
        #splash-text {
          color: white;
          font-size: 18px;
          font-weight: 500;
          margin-bottom: 28px;
          opacity: 0.92;
          letter-spacing: 0.4px;
        }

        /* Loader */
        .loader {
          width: 220px;
          height: 4px;
          background: rgba(255, 255, 255, 0.12);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }

        .loader::before {
          content: "";
          position: absolute;
          left: -40%;
          width: 40%;
          height: 100%;
          background: #60a5fa;
          border-radius: 999px;
          animation: loading 1.2s infinite ease;
        }

        @keyframes loading {
          0% {
            left: -40%;
          }

          100% {
            left: 100%;
          }
        }

        @keyframes pulse {
          0% {
            transform: scale(1);
            opacity: 1;
          }

          50% {
            transform: scale(1.05);
            opacity: 0.85;
          }

          100% {
            transform: scale(1);
            opacity: 1;
          }
        }

        /* Fade out */
        .fade-out {
          opacity: 0;
          pointer-events: none;
        }
    </style>
</head>

<body>

<!-- Splash -->
<div id="splash">
    <!-- Logo de la consola de storage -->
    <img src="icons/Icon-192.png" alt="Feather Storage Logo">

    <div id="splash-text">
        Conectando al servicio de almacenamiento...
    </div>

    <div class="loader"></div>
</div>

<!-- ENV -->
<script src="env.js"></script>

<!-- Flutter -->
<script src="flutter_bootstrap.js" async=""></script>

<!-- Remove splash when Flutter renders first frame -->
<script>
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('splash');

      if (splash) {
        splash.classList.add('fade-out');

        setTimeout(() => {
          splash.remove();
          document.body.style.background = 'transparent';
        }, 400);
      }
    });
</script>

</body>

</html>
